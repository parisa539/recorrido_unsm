    });

    // Cartel de texto que siempre mira a la cámara
    function texturaTexto(lineas, fondo, colorTexto) {
      const c = document.createElement('canvas'); const ctx = c.getContext('2d');
      const tam = [56, 34]; ctx.font = `800 ${tam[0]}px system-ui, sans-serif`;
      let ancho = 0; lineas.forEach((t, i) => { ctx.font = `${i ? 600 : 800} ${tam[Math.min(i,1)]}px system-ui, sans-serif`; ancho = Math.max(ancho, ctx.measureText(t).width); });
      c.width = Math.ceil(ancho + 60); c.height = lineas.length > 1 ? 140 : 90;
      ctx.fillStyle = fondo; ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 26); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.fillStyle = colorTexto; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      lineas.forEach((t, i) => { ctx.font = `${i ? 600 : 800} ${tam[Math.min(i,1)]}px system-ui, sans-serif`;
        ctx.fillText(t, c.width / 2, lineas.length > 1 ? (i ? 104 : 46) : c.height / 2 + 2); });
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
      return { tex, aspecto: c.width / c.height };
    }
    AFRAME.registerComponent('etiqueta', {
      schema: { texto: { default: '' }, sub: { default: '' }, fondo: { default: '#14401f' }, color: { default: '#ffffff' }, alto: { default: 0.035 } },
      init() {
        const lineas = this.data.sub ? [this.data.texto, this.data.sub] : [this.data.texto];
        const { tex, aspecto } = texturaTexto(lineas, this.data.fondo, this.data.color);
        const h = this.data.alto * (lineas.length > 1 ? 1.4 : 1);
        const m = new THREE.Mesh(new THREE.PlaneGeometry(h * aspecto, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: true }));
        this.el.setObject3D('mesh', m);
        this.camPos = new THREE.Vector3();
      },
      tick() {
        const cam = this.el.sceneEl.camera; if (!cam) return;
        cam.getWorldPosition(this.camPos);
        this.el.object3D.lookAt(this.camPos);
      }
    });

    // Estabilizador: sigue al folleto suavemente y se queda QUIETO si casi no se mueve; acelera si el movimiento es grande
    AFRAME.registerComponent('seguir-suave', {
      schema: { objetivo: { type: 'selector' }, rapidez: { default: 6 }, zonaPos: { default: 0.03 }, zonaRot: { default: 3 } },
      init() { this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3(); this.siguiendo = false; this.moviendo = false; this.saltar = true; this.el.object3D.visible = false; },
      seguir(saltar) { this.siguiendo = true; if (saltar) this.saltar = true; },
      detener() { this.siguiendo = false; },
      tick(t, dt) {
        if (!this.siguiendo || !dt) return;
        const o = this.data.objetivo.object3D; o.updateMatrixWorld(true); o.matrixWorld.decompose(this.p, this.q, this.s);
        if (!this.s.x) return;
        const yo = this.el.object3D;
        if (this.saltar) { yo.position.copy(this.p); yo.quaternion.copy(this.q); yo.scale.copy(this.s); this.saltar = false; this.moviendo = false; return; }
        const dist = yo.position.distanceTo(this.p) / this.s.x, ang = THREE.MathUtils.radToDeg(yo.quaternion.angleTo(this.q));
        if (!this.moviendo && dist < this.data.zonaPos && ang < this.data.zonaRot) return;
        this.moviendo = true;
        const rapidez = Math.min(this.data.rapidez + dist * 250 + ang * 1.5, 30), a = 1 - Math.exp(-rapidez * Math.min(dt, 100) / 1000);
        yo.position.lerp(this.p, a); yo.quaternion.slerp(this.q, a); yo.scale.lerp(this.s, a);
        if (dist < 0.004 && ang < 0.4) this.moviendo = false;
      }
    });
  </script>
</head>
<body>
  <div id="inicio">
    <img src="./escudo.png" alt="Escudo UNSM">
    <h1>Recorrido de bienvenida UNSM</h1>
    <p>Toca <b>Comenzar</b>, permite la cámara y apunta al <b>mapa del folleto</b>. Los edificios saldrán en 3D: tócalos para saber qué hay en cada uno.</p>
    <button id="btnIniciar">Comenzar</button>
  </div>

  <div id="aviso" class="aviso">✅ Mapa detectado</div>
  <button id="btnRecorrido" class="flotante">🧭 Recorrido</button>
  <button id="btnRuta" class="flotante">📍 ¿Cómo llego?</button>
  <button id="btnCongelar" class="flotante">❄️ Congelar</button>

  <div id="ficha">
    <div id="fichaFranja"></div>
    <div id="fichaCuerpo">
      <div id="fichaPaso"></div>
      <img id="fichaFoto" alt="">
      <div id="fichaCredito"></div>
      <h2 id="fichaTitulo"></h2>
      <p id="fichaSub"></p>
      <p id="fichaTexto"></p>
      <ul id="fichaLista"></ul>
    </div>
    <div id="fichaBotones">
      <button id="btnAnterior">◀ Anterior</button>
      <button id="btnCerrar">Cerrar</button>
      <button id="btnComoLlegar">📍 Cómo llegar</button>
      <button id="btnSiguiente">Siguiente ▶</button>
    </div>
  </div>

  <div id="rutas">
    <h3>📍 ¿A dónde quieres ir?</h3>
    <div class="origen">
      <button data-origen="puerta1" class="sel">Desde Puerta 1</button>
      <button data-origen="puerta2">Desde Puerta 2</button>
    </div>
    <div id="destinos"></div>
    <button id="btnCerrarRutas">Cerrar</button>
  </div>
  <div id="rutaInfo">
    <div id="rutaTexto"></div>
    <button id="btnOtraRuta" style="background:#f4b400;color:#14401f">Otro destino</button>
    <button id="btnQuitarRuta" style="background:#fff;color:#14401f">✕</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 15"
    color-space="sRGB" renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .tocable"></a-camera>
    <a-entity light="type: ambient; intensity: 0.75"></a-entity>

    <!-- El folleto detectado (MindAR lo mueve aquí) -->
    <a-entity id="folleto" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- La maqueta: el folleto es el piso. 1 = ancho del folleto; "z" = altura sobre el papel -->
    <a-entity id="contenido" seguir-suave="objetivo: #folleto">
      <a-entity id="centroLuz"></a-entity>
      <a-entity light="type: directional; intensity: 0.85; target: #centroLuz" position="-0.6 -1 1.6"></a-entity>
      <!-- anillo de luz que se abre desde el centro del mapa -->
      <a-ring class="anim" radius-inner="0.18" radius-outer="0.2" color="#f4b400" position="-0.17 0 0.004" scale="0.05 0.05 1"
        material="shader: flat; transparent: true; opacity: 0"
        animation__crecer="property: scale; from: 0.05 0.05 1; to: 2.2 2.2 1; dur: 1200; easing: easeOutCubic; startEvents: aparecer"
        animation__brillo="property: material.opacity; from: 1; to: 0; dur: 1200; easing: easeInQuad; startEvents: aparecer"></a-ring>
      <!-- marcador del recorrido -->
      <a-ring id="marcador" radius-inner="0.035" radius-outer="0.045" color="#f4b400" position="0 0 0.003" visible="false"
        material="shader: flat; transparent: true; opacity: 0.95"
        animation__latido="property: scale; from: 1 1 1; to: 1.35 1.35 1; dur: 700; dir: alternate; loop: true; easing: easeInOutSine"></a-ring>
      <a-entity id="maqueta"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector('a-scene'), folleto = document.querySelector('#folleto'), contenido = document.querySelector('#contenido');
    const maqueta = document.querySelector('#maqueta'), marcador = document.querySelector('#marcador');
    const aviso = document.querySelector('#aviso'), btnCongelar = document.querySelector('#btnCongelar'), btnRecorrido = document.querySelector('#btnRecorrido');
    const ficha = document.querySelector('#ficha');
    let mostrando = false, congelado = false, pasoRecorrido = -1, timerPerdido, timerAviso;

    /* ---------- Construir la maqueta a partir de los datos ---------- */
    function crecer(el, delay) {
      el.setAttribute('scale', '1 1 0.01'); el.dataset.escala = '1 1 0.01'; el.classList.add('anim', 'reiniciar');
      el.setAttribute('animation__crecer', `property: scale; from: 1 1 0.01; to: 1 1 1; dur: 900; delay: ${delay}; easing: easeOutBack; startEvents: aparecer`);
    }
    function edificiosHTML(eds, cx, cy, h, id) {
      return eds.map(E => `<a-entity class="tocable" data-id="${id}" position="${(E.x - cx).toFixed(4)} ${(E.y - cy).toFixed(4)} 0"
        edificio="w: ${E.w}; d: ${E.d}; h: ${h}; rot: ${E.rot}"></a-entity>`).join('');
    }
    LUGARES.forEach((L, i) => {
      const grupo = document.createElement('a-entity');
      grupo.id = 'lugar-' + L.id;
      grupo.setAttribute('position', `${L.c[0]} ${L.c[1]} 0`);
      grupo.setAttribute('animation__salto', `property: position; from: ${L.c[0]} ${L.c[1]} 0.03; to: ${L.c[0]} ${L.c[1]} 0; dur: 500; easing: easeOutQuad; startEvents: saltar`);
      crecer(grupo, 400 + i * 100);
      if (L.tipo === 'bloque') {
        grupo.innerHTML = `<a-entity class="tocable" data-id="${L.id}" zona="id: ${L.id}"></a-entity>`
          + edificiosHTML(L.ed, L.c[0], L.c[1], L.h, L.id)
          + `<a-entity position="0 0 ${(L.h + 0.06).toFixed(3)}" etiqueta="texto: ${L.id} · ${L.sig}; fondo: ${L.col}; alto: 0.026"></a-entity>`;
      } else {
        const esPuerta = L.id.startsWith('puerta'), color = esPuerta ? '#c62828' : '#1e5aa0';
        const alto = L.ed ? 0.075 : 0;
        grupo.innerHTML = (L.ed ? edificiosHTML(L.ed, L.c[0], L.c[1], 0.035, L.id) : '') + `
          <a-entity animation__flotar="property: position; from: 0 0 ${alto}; to: 0 0 ${alto + 0.012}; dur: 1100; delay: ${i * 90}; dir: alternate; loop: true; easing: easeInOutSine">
            <a-cone class="tocable" data-id="${L.id}" radius-bottom="0" radius-top="0.013" height="0.038" rotation="90 0 0" position="0 0 0.019" color="${color}" segments-radial="16"></a-cone>
            <a-sphere class="tocable" data-id="${L.id}" radius="0.015" position="0 0 0.045" color="${color}"></a-sphere>
            <a-entity position="0 0 0.085" etiqueta="texto: ${ICONOS[L.id]} ${L.nom}; fondo: ${color}; alto: 0.022"></a-entity>
          </a-entity>
          <a-circle radius="0.011" position="0 0 0.002" material="color: #000; transparent: true; opacity: 0.25; shader: flat; depthWrite: false"></a-circle>`;
      }
      maqueta.appendChild(grupo);
    });

    // Portada verde agua de la Puerta 1 (como la real)
    (() => {
      const P1 = LUGARES.find(l => l.id === 'puerta1').c, g = document.createElement('a-entity');
      g.setAttribute('position', `${P1[0] - 0.035} ${P1[1] + 0.012} 0`); g.setAttribute('rotation', '0 0 -28'); crecer(g, 300);
      g.innerHTML = `
        <a-box color="#5fb3a1" width="0.008" depth="0.03" height="0.008" position="-0.03 0 0.015"></a-box>
        <a-box color="#5fb3a1" width="0.008" depth="0.03" height="0.008" position="0.03 0 0.015"></a-box>
        <a-box color="#4a9d8b" width="0.075" depth="0.009" height="0.012" position="0 0 0.034"></a-box>
        <a-box color="#f4f1e8" width="0.05" depth="0.005" height="0.0125" position="0 0 0.034"></a-box>`;
      maqueta.appendChild(g);
    })();
    // Monumento (obelisco) en el óvalo
    (() => {
      const M = LUGARES.find(l => l.id === 'monumento').c, g = document.createElement('a-entity');
      g.setAttribute('position', `${M[0]} ${M[1]} 0`); crecer(g, 350);
      g.innerHTML = `<a-cylinder color="#d9d4c7" radius="0.012" height="0.006" rotation="90 0 0" position="0 0 0.003"></a-cylinder>
                     <a-cone color="#cfc8b6" radius-bottom="0.005" radius-top="0.0015" height="0.045" rotation="90 0 0" position="0 0 0.028" segments-radial="4"></a-cone>`;
      maqueta.appendChild(g);
    })();
    // Piscina con agua
    (() => {
      const P = EXTRA.piscina, g = document.createElement('a-entity');
      g.setAttribute('position', `${P.x} ${P.y} 0`); crecer(g, 900);
      g.innerHTML = `<a-box color="#efeae0" width="${P.w + 0.008}" height="${P.d + 0.008}" depth="0.006" position="0 0 0.003"></a-box>
        <a-plane color="#3fb0e0" width="${P.w}" height="${P.d}" position="0 0 0.0065" material="roughness: 0.15; metalness: 0.1"
          animation__agua="property: material.color; from: #3fb0e0; to: #5fc8f0; dur: 1500; dir: alternate; loop: true"></a-plane>`;
      maqueta.appendChild(g);
    })();
    // Árboles 3D
    EXTRA.arboles.forEach((A, k) => {
      const g = document.createElement('a-entity'), s = (0.8 + (k % 5) * 0.1).toFixed(2);
      g.setAttribute('position', `${A[0]} ${A[1]} 0`); crecer(g, 700 + k * 25);
      g.innerHTML = `<a-entity scale="${s} ${s} ${s}">
          <a-cylinder color="#7a5232" radius="0.002" height="0.016" rotation="90 0 0" position="0 0 0.008"></a-cylinder>
          <a-sphere color="${k % 2 ? '#3f8f45' : '#2f7a3a'}" radius="0.011" position="0 0 0.022" segments-width="8" segments-height="6"></a-sphere></a-entity>`;
      maqueta.appendChild(g);
    });

    /* ---------- Ficha de información ---------- */
    function abrirFicha(id) {
      const I = INFO[id], L = LUGARES.find(l => l.id === id);
      document.querySelector('#fichaFranja').style.background = L.col || (id.startsWith('puerta') ? '#c62828' : '#1e5aa0');
      document.querySelector('#fichaTitulo').textContent = I.titulo;
      document.querySelector('#fichaSub').textContent = I.sub;
      document.querySelector('#fichaTexto').textContent = I.texto + (I.horario ? `  🕒 Horario: ${I.horario}` : '');
      document.querySelector('#fichaLista').innerHTML = I.lista.map(t => `<li>${t}</li>`).join('');
      // Foto real: si existe el archivo foto-<lugar>.jpg en el repositorio, se muestra
      const foto = document.querySelector('#fichaFoto'); foto.style.display = 'none';
      const cred = document.querySelector('#fichaCredito'); cred.style.display = 'none'; cred.textContent = I.credito || '';
      foto.onload = () => { foto.style.display = 'block'; if (I.credito) cred.style.display = 'block'; };
      foto.onerror = () => { if (foto.src.endsWith('.jpg')) foto.src = `foto-${id.toLowerCase()}.png`; };
      foto.src = `foto-${id.toLowerCase()}.jpg`;
      fichaId = id;
      const enRecorrido = pasoRecorrido >= 0;
      document.querySelector('#fichaPaso').textContent = enRecorrido ? `Recorrido · paso ${pasoRecorrido + 1} de ${RECORRIDO.length}` : '';
      document.querySelector('#btnAnterior').style.display = enRecorrido ? '' : 'none';
      document.querySelector('#btnSiguiente').style.display = enRecorrido ? '' : 'none';
      document.querySelector('#btnCerrar').textContent = enRecorrido ? 'Salir' : 'Cerrar';
      document.querySelector('#btnComoLlegar').style.display = enRecorrido || id === origenRuta ? 'none' : '';
      ficha.classList.add('visible');
      // resaltar el lugar en la maqueta
      document.querySelector('#lugar-' + id).emit('saltar', null, false);
      marcador.setAttribute('position', `${L.c[0]} ${L.c[1]} 0.003`); marcador.setAttribute('visible', true);
    }
    function cerrarFicha() { ficha.classList.remove('visible'); marcador.setAttribute('visible', false); pasoRecorrido = -1; btnRecorrido.classList.remove('activo'); }
    document.querySelector('#btnCerrar').addEventListener('click', cerrarFicha);
    document.querySelector('#btnSiguiente').addEventListener('click', () => { pasoRecorrido = (pasoRecorrido + 1) % RECORRIDO.length; abrirFicha(RECORRIDO[pasoRecorrido]); });
    document.querySelector('#btnAnterior').addEventListener('click', () => { pasoRecorrido = (pasoRecorrido - 1 + RECORRIDO.length) % RECORRIDO.length; abrirFicha(RECORRIDO[pasoRecorrido]); });
    btnRecorrido.addEventListener('click', () => { quitarRuta(); panelRutas.classList.remove('visible'); pasoRecorrido = 0; btnRecorrido.classList.add('activo'); abrirFicha(RECORRIDO[0]); });

    /* ---------- ¿Cómo llego? ---------- */
    let origenRuta = 'puerta1', fichaId = null;
    const panelRutas = document.querySelector('#rutas'), rutaInfo = document.querySelector('#rutaInfo');
    const btnRuta = document.querySelector('#btnRuta');
    // botones de destino
    const DESTINOS = ['A','B','C','D','E','F','G','H','I','comedor','cafetin','cafeteria','medico','auditorio','piscina','losas','campo','monumento','puerta1','puerta2'];
    document.querySelector('#destinos').innerHTML = DESTINOS.map(id => {
      const L = LUGARES.find(l => l.id === id), I = INFO[id];
      const marca = L.tipo === 'bloque' ? `<span style="background:${L.col}">${id}</span>${L.sig}` : I.titulo;
      return `<button data-destino="${id}">${marca}</button>`;
    }).join('');
    document.querySelectorAll('.origen button').forEach(b => b.addEventListener('click', () => {
      origenRuta = b.dataset.origen;
      document.querySelectorAll('.origen button').forEach(x => x.classList.toggle('sel', x === b));
    }));
    document.querySelectorAll('#destinos button').forEach(b => b.addEventListener('click', () => { panelRutas.classList.remove('visible'); trazarRuta(b.dataset.destino); }));
    btnRuta.addEventListener('click', () => { cerrarFicha(); rutaInfo.classList.remove('visible'); panelRutas.classList.add('visible'); });
    document.querySelector('#btnCerrarRutas').addEventListener('click', () => panelRutas.classList.remove('visible'));
    document.querySelector('#btnOtraRuta').addEventListener('click', () => { rutaInfo.classList.remove('visible'); panelRutas.classList.add('visible'); });
    document.querySelector('#btnQuitarRuta').addEventListener('click', quitarRuta);
    document.querySelector('#btnComoLlegar').addEventListener('click', () => { const id = fichaId; cerrarFicha(); trazarRuta(id); });

    // camino más corto (Dijkstra) por la red de pistas del croquis
    const N3 = {}; Object.entries(NODOS).forEach(([k, p]) => N3[k] = a3D(p[0], p[1]));
    const VEC = {}; Object.keys(N3).forEach(k => VEC[k] = []);
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    ARISTAS.forEach(([a, b]) => { const d = dist(N3[a], N3[b]); VEC[a].push([b, d]); VEC[b].push([a, d]); });
    function nodoCercano(p) { let m = null, md = 1e9; for (const k in N3) { const d = dist(N3[k], p); if (d < md) { md = d; m = k; } } return m; }
    function caminoMasCorto(ini, fin) {
      const D = {}, prev = {}, pend = new Set(Object.keys(N3)); Object.keys(N3).forEach(k => D[k] = Infinity); D[ini] = 0;
      while (pend.size) {
        let u = null; for (const k of pend) if (u === null || D[k] < D[u]) u = k;
        pend.delete(u); if (u === fin) break;
        for (const [v, w] of VEC[u]) if (D[u] + w < D[v]) { D[v] = D[u] + w; prev[v] = u; }
      }
      const r = [fin]; while (r[0] !== ini) r.unshift(prev[r[0]]); return r;
    }

    const rutaEl = document.createElement('a-entity'); rutaEl.id = 'ruta'; maqueta.appendChild(rutaEl);
    let animRuta = null;
    function quitarRuta() {
      if (animRuta) cancelAnimationFrame(animRuta), animRuta = null;
      rutaEl.removeObject3D('mesh'); rutaInfo.classList.remove('visible'); marcador.setAttribute('visible', false);
    }
    function trazarRuta(destino) {
      quitarRuta();
      const origen = origenRuta === destino ? (destino === 'puerta1' ? 'puerta2' : 'puerta1') : origenRuta;
      const Lo = LUGARES.find(l => l.id === origen), Ld = LUGARES.find(l => l.id === destino);
      const nIni = nodoCercano(Lo.c), nFin = nodoCercano(Ld.c);
      const pts = [Lo.c, ...caminoMasCorto(nIni, nFin).map(k => N3[k]), Ld.c]
        .filter((p, i, arr) => i === 0 || dist(p, arr[i - 1]) > 0.004)
        .map(p => new THREE.Vector3(p[0], p[1], 0.014));
      const curva = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.2);
      const largo = curva.getLength(), seg = Math.max(60, Math.round(largo * 400));
      const g = new THREE.Group();
      const tubo = new THREE.Mesh(new THREE.TubeGeometry(curva, seg, 0.0065, 10, false), new THREE.MeshBasicMaterial({ color: '#0057ff' }));
      const brillo = new THREE.Mesh(new THREE.TubeGeometry(curva, seg, 0.0095, 10, false), new THREE.MeshBasicMaterial({ color: '#ffffff', side: THREE.BackSide }));
      g.add(brillo, tubo);
      // personaje que camina
      const persona = new THREE.Group();
      const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0065, 0.02, 12).rotateX(Math.PI / 2).translate(0, 0, 0.012), new THREE.MeshStandardMaterial({ color: '#2e8c3e' }));
      const cabeza = new THREE.Mesh(new THREE.SphereGeometry(0.0062, 12, 10).translate(0, 0, 0.0285), new THREE.MeshStandardMaterial({ color: '#f1c27d' }));
      const mochila = new THREE.Mesh(new THREE.BoxGeometry(0.007, 0.004, 0.009).translate(0, -0.006, 0.014), new THREE.MeshStandardMaterial({ color: '#f4b400' }));
      const puntos = []; const geoP = new THREE.SphereGeometry(0.0045, 10, 8), matP = new THREE.MeshBasicMaterial({ color: '#ffffff' });
      for (let i = 0; i < 12; i++) { const s = new THREE.Mesh(geoP, matP); s.visible = false; puntos.push(s); g.add(s); }
      persona.add(cuerpo, cabeza, mochila); persona.scale.setScalar(1.7); persona.visible = false; g.add(persona);
      rutaEl.setObject3D('mesh', g);
      // marcador en el destino
      marcador.setAttribute('position', `${Ld.c[0]} ${Ld.c[1]} 0.003`); marcador.setAttribute('visible', true);
      document.querySelector('#lugar-' + destino).emit('saltar', null, false);
      // animación: la línea se dibuja y luego el personaje la recorre una y otra vez
      const total = tubo.geometry.index.count, t0 = performance.now(), DIBUJO = 1600, VEL = 0.09;
      const fin = new THREE.Vector3(), sig = new THREE.Vector3();
      const paso = (ahora) => {
        const tt = ahora - t0;
        const k = Math.min(tt / DIBUJO, 1), n = Math.floor(total * k / 3) * 3;
        tubo.geometry.setDrawRange(0, n); brillo.geometry.setDrawRange(0, n);
        if (k >= 1) {
          persona.visible = true;
          const u = ((tt - DIBUJO) / 1000 * VEL / largo) % 1;
          curva.getPointAt(u, fin); curva.getPointAt(Math.min(u + 0.01, 1), sig);
          persona.position.copy(fin).setZ(0.012 + Math.abs(Math.sin(tt / 120)) * 0.003);
          persona.rotation.z = Math.atan2(sig.y - fin.y, sig.x - fin.x) - Math.PI / 2;
          puntos.forEach((s, i) => { s.visible = true; curva.getPointAt(((tt / 1000) * 0.25 + i / puntos.length) % 1, s.position); });
        }
        animRuta = requestAnimationFrame(paso);
      };
      animRuta = requestAnimationFrame(paso);
      const nombre = l => l.tipo === 'bloque' ? `Bloque ${l.id} · ${l.sig}` : INFO[l.id].titulo.replace(/^\S+\s/, '');
      document.querySelector('#rutaTexto').innerHTML = `🚶 Desde <b>${nombre(Lo)}</b><br>hasta <b>${nombre(Ld)}</b>`;
      rutaInfo.classList.add('visible');
    }

    let ultimoToque = 0;
    escena.addEventListener('loaded', () => {
      document.querySelectorAll('.tocable').forEach(el => el.addEventListener('click', () => {
        if (!mostrando || Date.now() - ultimoToque < 500) return;
        ultimoToque = Date.now(); pasoRecorrido = -1; btnRecorrido.classList.remove('activo'); abrirFicha(el.dataset.id);
      }));
    });

    /* ---------- Cámara, detección y congelar ---------- */
    const sistemaAR = () => escena.systems['mindar-image-system'];
    document.querySelector('#btnIniciar').addEventListener('click', () => {
      document.querySelector('#inicio').style.display = 'none';
      escena.hasLoaded ? sistemaAR().start() : escena.addEventListener('loaded', () => sistemaAR().start());
    });
    function congelar(si) {
      congelado = si;
      if (si) { sistemaAR().pause(false); clearTimeout(timerPerdido); } else { sistemaAR().unpause(); }
      btnCongelar.textContent = si ? '▶️ Seguir' : '❄️ Congelar'; btnCongelar.classList.toggle('activo', si);
    }
    btnCongelar.addEventListener('click', () => congelar(!congelado));
    const seguidor = () => contenido.components['seguir-suave'];
    function reiniciar() { maqueta.querySelectorAll('.reiniciar').forEach(el => el.setAttribute('scale', el.dataset.escala)); }

    folleto.addEventListener('targetFound', () => {
      clearTimeout(timerPerdido);
      if (mostrando) { seguidor().seguir(false); return; }
      mostrando = true; seguidor().seguir(true); contenido.object3D.visible = true;
      contenido.querySelectorAll('.anim').forEach(el => el.emit('aparecer', null, false));
      btnCongelar.style.display = btnRecorrido.style.display = btnRuta.style.display = 'block';
      aviso.classList.add('visible'); clearTimeout(timerAviso); timerAviso = setTimeout(() => aviso.classList.remove('visible'), 1800);
      if (navigator.vibrate) navigator.vibrate(60);
    });
    folleto.addEventListener('targetLost', () => {
      seguidor().detener();
      timerPerdido = setTimeout(() => {
        if (congelado) return;
        mostrando = false; contenido.object3D.visible = false; btnCongelar.style.display = btnRecorrido.style.display = btnRuta.style.display = 'none';
        cerrarFicha(); quitarRuta(); panelRutas.classList.remove('visible'); reiniciar();
      }, 1200);
    });
  </script>
</body>
</html>
